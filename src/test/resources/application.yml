spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://escaperoomc15.us.auth0.com/
          audiences: https://api.escaperoomc15
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

c15:
  acertijos:
    # Las pruebas usan siempre las 3 preguntas de siempre (conocen sus respuestas); en produccion se sortean
    sorteo: false
  estado:
    margen: 10m
  partida:
    # La gracia para volver al mapa (40 s en produccion): corta para que las pruebas no esperen
    gracia-desconexion: 300ms
  eventos:
    # Sin Kafka: las pruebas publican los eventos directo (ApplicationEventPublisher); *KafkaTest lo enciende
    kafka: false
  stomp:
    broker:
      relay: false

management:
  otlp:
    tracing:
      export:
        enabled: false
    logging:
      export:
        enabled: false
